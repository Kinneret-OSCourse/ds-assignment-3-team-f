# TLS overlay - merge with docker-compose.yml to activate AMQPS on port 5671
# and have all four application services connect over TLS.
#
#   ./scripts/generate-certs.sh           # one time
#   export MULLIGAN_HMAC_KEY=$(openssl rand -hex 32)
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
#
# How this overlay works:
#   * Docker Compose concatenates `volumes:` lists when merging, so we mount
#     the TLS configuration at a DIFFERENT target (/etc/rabbitmq/rabbitmq-tls.conf)
#     and tell RabbitMQ to use it by setting RABBITMQ_CONFIG_FILE. The plain
#     rabbitmq.conf from the base file remains mounted but is ignored by the
#     broker because RABBITMQ_CONFIG_FILE wins.
#   * The cert directory is mounted into each rabbit-* service at
#     /etc/rabbitmq/certs so the broker can read server-cert.pem and
#     server-key.pem.
#   * Port 5671 is exposed on rabbit-1 for external AMQPS clients. The plain
#     5672 listener stays open inside the TLS conf so a rollback by removing
#     `-f docker-compose.tls.yml` continues to work without changing tests.
#   * The four application services get MULLIGAN_QUEUE_TLS=true, the AMQPS
#     host list, and the truststore env. The TlsConfig class wires the
#     SSLContext into the AMQP factory automatically.
#
# What this overlay does NOT change:
#   * PostgreSQL/Patroni TLS - the Spilo image's Postgres listener is not
#     configured for TLS in this revision, and HAProxy frontends Patroni in
#     TCP mode. MULLIGAN_DB_TLS is supported by the Java client but kept
#     `false` because activating it without the listener change would break
#     JDBC.
#   * mTLS - rabbitmq-tls.conf defaults to `ssl_options.verify = verify_none`.
#     Flip to `verify_peer` + `fail_if_no_peer_cert = true` and set
#     MULLIGAN_TLS_KEYSTORE per service (using the client-<svc>.p12 files the
#     cert script now produces).

services:

  rabbit-1:
    environment:
      RABBITMQ_CONFIG_FILE: /etc/rabbitmq/rabbitmq-tls
    volumes:
      - ./infra/rabbitmq/rabbitmq-tls.conf:/etc/rabbitmq/rabbitmq-tls.conf:ro
      - ./infra/certs:/etc/rabbitmq/certs:ro
    ports:
      - "${MULLIGAN_RABBIT_AMQPS_PORT:-5671}:5671"

  rabbit-2:
    environment:
      RABBITMQ_CONFIG_FILE: /etc/rabbitmq/rabbitmq-tls
    volumes:
      - ./infra/rabbitmq/rabbitmq-tls.conf:/etc/rabbitmq/rabbitmq-tls.conf:ro
      - ./infra/certs:/etc/rabbitmq/certs:ro

  rabbit-3:
    environment:
      RABBITMQ_CONFIG_FILE: /etc/rabbitmq/rabbitmq-tls
    volumes:
      - ./infra/rabbitmq/rabbitmq-tls.conf:/etc/rabbitmq/rabbitmq-tls.conf:ro
      - ./infra/certs:/etc/rabbitmq/certs:ro

  parking-server:
    environment:
      MULLIGAN_QUEUE_TLS: "true"
      MULLIGAN_QUEUE_HOSTS: rabbit-1:5671,rabbit-2:5671,rabbit-3:5671
      MULLIGAN_TLS_TRUSTSTORE: /etc/mulligan/certs/truststore.p12
      MULLIGAN_TLS_TRUSTSTORE_PASSWORD: ${MULLIGAN_TLS_PASSWORD:-mulligan_tls_pw}
    volumes:
      - ./infra/certs:/etc/mulligan/certs:ro

  customer-ui:
    environment:
      MULLIGAN_QUEUE_TLS: "true"
      MULLIGAN_QUEUE_HOSTS: rabbit-1:5671,rabbit-2:5671,rabbit-3:5671
      MULLIGAN_TLS_TRUSTSTORE: /etc/mulligan/certs/truststore.p12
      MULLIGAN_TLS_TRUSTSTORE_PASSWORD: ${MULLIGAN_TLS_PASSWORD:-mulligan_tls_pw}
    volumes:
      - ./infra/certs:/etc/mulligan/certs:ro

  peo-ui:
    environment:
      MULLIGAN_QUEUE_TLS: "true"
      MULLIGAN_QUEUE_HOSTS: rabbit-1:5671,rabbit-2:5671,rabbit-3:5671
      MULLIGAN_TLS_TRUSTSTORE: /etc/mulligan/certs/truststore.p12
      MULLIGAN_TLS_TRUSTSTORE_PASSWORD: ${MULLIGAN_TLS_PASSWORD:-mulligan_tls_pw}
    volumes:
      - ./infra/certs:/etc/mulligan/certs:ro

  mo-ui:
    environment:
      MULLIGAN_QUEUE_TLS: "true"
      MULLIGAN_QUEUE_HOSTS: rabbit-1:5671,rabbit-2:5671,rabbit-3:5671
      MULLIGAN_TLS_TRUSTSTORE: /etc/mulligan/certs/truststore.p12
      MULLIGAN_TLS_TRUSTSTORE_PASSWORD: ${MULLIGAN_TLS_PASSWORD:-mulligan_tls_pw}
    volumes:
      - ./infra/certs:/etc/mulligan/certs:ro
