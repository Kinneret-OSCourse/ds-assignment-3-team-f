/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java-library'
    id 'application'
    id 'maven-publish'
    id 'org.openjfx.javafxplugin' version '0.1.0' // Use the latest version

}

javafx {
    version = "21"
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}


application {
    mainClass.set('com.mulligan.mo.MOUIApplication')
}

tasks.register('runCli', JavaExec) {
    group = 'application'
    description = 'Runs the management office CLI.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mulligan.mo.cli.MOCLI'
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

dependencies {
    implementation project(':parking-common')
    implementation "org.openjfx:javafx-controls:21"
    implementation "org.openjfx:javafx-fxml:21"
    implementation 'com.rabbitmq:amqp-client:5.21.0'
    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'org.slf4j:slf4j-simple:2.0.13'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

group = 'com.mulligan.mo'
version = '1.0-SNAPSHOT'
description = 'mo-ui'
java.sourceCompatibility = JavaVersion.VERSION_21
java.targetCompatibility = JavaVersion.VERSION_21

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

test {
    useJUnitPlatform()
}
