# TLS-enabled RabbitMQ configuration for the Mulligan cluster.
#
# This file is identical to rabbitmq.conf with the addition of an AMQPS
# listener on 5671. It is only mounted into the rabbit containers when the
# operator opts into TLS via the docker-compose.tls.yml overlay. Mounting
# this file without the cert material in /etc/rabbitmq/certs/ will cause the
# broker to refuse to start, which is why the default stack keeps using
# rabbitmq.conf.
#
# To activate one-way TLS (server presents a cert, clients verify it):
#     ./scripts/generate-certs.sh                                    # produces infra/certs/*
#     docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# To activate mTLS (both sides present certificates):
#     1. generate-certs.sh also writes per-service client certs.
#     2. Flip `ssl_options.verify` below to `verify_peer` and
#        `ssl_options.fail_if_no_peer_cert` to `true`.
#     3. Set MULLIGAN_TLS_KEYSTORE / MULLIGAN_TLS_KEYSTORE_PASSWORD on each
#        application service to its per-service keystore.
#

# Restrict guest to loopback (Assignment 2 §1.1 RabbitMQ Hardening).
loopback_users.guest = true

# Plain AMQP listener still bound so existing tests keep working during the
# migration. Remove this line to require TLS for every client.
listeners.tcp.default = 5672

# AMQPS listener. Cert paths are provided by the docker-compose volume mount.
listeners.ssl.default = 5671
ssl_options.cacertfile  = /etc/rabbitmq/certs/ca.pem
ssl_options.certfile    = /etc/rabbitmq/certs/server-cert.pem
ssl_options.keyfile     = /etc/rabbitmq/certs/server-key.pem

# One-way TLS by default: clients verify the broker, broker does NOT require
# a client cert. Flip to `verify_peer` + `fail_if_no_peer_cert = true` to
# require mTLS.
ssl_options.verify              = verify_none
ssl_options.fail_if_no_peer_cert = false

# Use modern TLS only.
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2

management.load_definitions = /etc/rabbitmq/definitions.json

vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 200MB

cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbit-3
cluster_partition_handling = pause_minority
