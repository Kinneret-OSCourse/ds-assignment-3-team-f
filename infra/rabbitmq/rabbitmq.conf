# RabbitMQ configuration for the Mulligan 3-node cluster.
#
# Blue-Team requirements addressed here:
#   * `loopback_users.guest = true` keeps the default `guest` user usable only
#     from localhost inside a container - never reachable across the network.
#   * `default_user_tags.administrator = false` so any new user we mint by
#     mistake does not inherit administrator privileges.
#   * `management.load_definitions` imports the per-service users with the
#     least-privilege ACLs declared in `definitions.json`.
#   * `cluster_formation.peer_discovery_backend = classic_config` together with
#     the seed list below forms the 3-node cluster automatically on the
#     `rabbit-1` seed node.
#

# Restrict guest to loopback (Assignment 2 §1.1 RabbitMQ Hardening).
loopback_users.guest = true

# Force-load the operator's definitions: users, vhosts, permissions, policies.
management.load_definitions = /etc/rabbitmq/definitions.json

# Memory/disk thresholds tuned for a classroom-sized workload.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 200MB

# Cluster formation: the seed node `rabbit-1` brings up the cluster; the two
# other nodes are joined to it by `join-cluster.sh` at boot.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbit-3
cluster_partition_handling = pause_minority
