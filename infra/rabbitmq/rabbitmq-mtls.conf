# Mutual-TLS (mTLS) RabbitMQ configuration for the Mulligan cluster.
#
# This file is identical to rabbitmq-tls.conf except that the AMQPS listener
# requires every connecting client to present an X.509 certificate signed by
# the Mulligan CA. It is only mounted into the rabbit containers when the
# operator opts into mTLS via the docker-compose.mtls.yml overlay (which is
# layered ON TOP of the existing docker-compose.tls.yml overlay).
#
# Activation flow:
#   ./scripts/generate-certs.sh
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.tls.yml \
#                  -f docker-compose.mtls.yml up -d --build
#
# Rolling back to one-way TLS is a single flag removal — drop the
# `-f docker-compose.mtls.yml` and the verified AMQPS overlay path is restored.
#
# Note on the plain 5672 listener:
#   The plain AMQP listener is intentionally left bound so any container or
#   helper script that still uses 5672 keeps working during the migration. To
#   force-require AMQPS+mTLS for every client, comment out the
#   `listeners.tcp.default = 5672` line.

# Restrict guest to loopback (Assignment 2 §1.1 RabbitMQ Hardening).
loopback_users.guest = true

# Plain AMQP listener kept up to avoid breaking the verified one-way TLS path
# and pre-TLS clients during migration. Comment to require TLS for every client.
listeners.tcp.default = 5672

# AMQPS listener with mutual authentication.
listeners.ssl.default = 5671
ssl_options.cacertfile  = /etc/rabbitmq/certs/ca.pem
ssl_options.certfile    = /etc/rabbitmq/certs/server-cert.pem
ssl_options.keyfile     = /etc/rabbitmq/certs/server-key.pem

# mTLS: require the client to present a certificate signed by the same CA.
# `verify_peer` makes the broker validate the chain; `fail_if_no_peer_cert`
# rejects any client that does not send a cert at all.
ssl_options.verify              = verify_peer
ssl_options.fail_if_no_peer_cert = true

# Use modern TLS only.
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2

management.load_definitions = /etc/rabbitmq/definitions.json

vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 200MB

cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbit-3
cluster_partition_handling = pause_minority
