# HAProxy in front of the 3-node Patroni cluster.
#
# Patroni exposes a REST API on port 8008 that reports whether the local node
# is the leader. HAProxy uses `httpchk` against /master to forward traffic
# only to the current primary, which is what makes failover transparent to
# the JDBC clients in the UIs.

global
    maxconn 200

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    retries 3

frontend stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s

listen postgres_primary
    bind *:5432
    option httpchk OPTIONS /master
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni-1 patroni-1:5432 maxconn 100 check port 8008
    server patroni-2 patroni-2:5432 maxconn 100 check port 8008
    server patroni-3 patroni-3:5432 maxconn 100 check port 8008
