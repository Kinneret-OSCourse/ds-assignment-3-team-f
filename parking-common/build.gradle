/*
 * parking-common
 *
 * Shared security, messaging, validation, and cluster helpers used by the
 * Customer UI, PEO UI, MO UI and Queue Server modules. Centralising this code
 * eliminates the four near-identical copies that existed in Assignment 1 and
 * is the foundation for the Blue Team defences required by Assignment 2.
 */
plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    api 'com.rabbitmq:amqp-client:5.21.0'
    api 'org.postgresql:postgresql:42.7.3'
    api 'org.slf4j:slf4j-simple:2.0.13'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

group = 'com.mulligan.common'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    useJUnitPlatform()
}
